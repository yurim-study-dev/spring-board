# 비밀 프로필(application-secret.properties) 자동 로드
spring.profiles.include=secret

spring.application.name=spring-board
server.port=8080
spring.devtools.livereload.enabled=true

# TRACE, DEBUG, INFO, WARN, ERROR
logging.level.net.likelion.bebc25=DEBUG
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari.HikariDataSource=DEBUG

# 로깅 포맷 지정
logging.pattern.console=%clr(%-5level) %logger{0} - %msg%n

# 로그 파일 설정 (logs/ 하위에 날짜별 10MB 크기 제한)
logging.file.name=logs/app.log
logging.logback.rollingpolicy.file-name-pattern=logs/app-%d{yyyy-MM-dd}.%02i.log
logging.logback.rollingpolicy.max-file-size=10MB

# 커넥션 풀 설정
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=2

# 스프링 구동 시 DB 초기화 스크립트 실행(schema.sql, data.sql)
spring.sql.init.mode=never

# 첨부파일 및 이미지 업로드 저장 디렉터리 경로 설정
file.dir=./uploads/