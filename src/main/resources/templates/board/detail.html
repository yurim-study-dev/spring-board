<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>스프링 게시판 - 상세 보기</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/detail.css">
</head>
<body>
  <div class="container">
    <th:block th:replace="~{layout/common :: nav-header('게시글 상세 정보')}">
      <h1>게시글 상세 정보</h1>
      <div class="nav">
        <a href="list">목록으로</a>
        <a href="write">새 글 쓰기</a>
      </div>
    </th:block>

    <table class="detail-table">
      <tr>
        <th>번호</th>
        <td th:text="${post.id}">3</td>
      </tr>
      <tr>
        <th>제목</th>
        <td th:text="${post.title}">세 번째 게시글 제목 샘플</td>
      </tr>
      <tr>
        <th>작성자</th>
        <td th:text="${post.author}">작성자3</td>
      </tr>
      <tr>
        <th>작성일시</th>
        <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2026-07-13 15:30:00</td>
      </tr>
      <tr>
        <th>내용</th>
        <td th:text="${post.content}" class="pre-wrap">세 번째 게시글의 본문</td>
      </tr>
      <tr th:if="${post.originalFilename != null}">
        <th>첨부파일</th>
        <td>
          <div>
            <a th:href="@{/post/download/{id}(id=${post.id})}" th:text="${post.originalFilename}">첨부파일.txt</a>
          </div>
          <div th:if="${isImage}" style="margin-top: 10px;">
            <img th:src="@{/images/{filename}(filename=${post.storeFilename})}" alt="첨부 이미지 미리보기" style="max-width: 100%; max-height: 400px; border-radius: 4px; border: 1px solid #ddd; padding: 3px;">
          </div>
        </td>
      </tr>
    </table>

    <div class="btn-group-right">
      <a th:href="@{edit(id=${post.id})}" class="btn">수정</a>
      <form th:action="@{delete(id=${post.id})}" method="POST" style="display:inline;">
        <button type="submit" class="btn btn-danger" onclick="return confirm('정말로 삭제하시겠습니까?');">삭제</button>
      </form>
      <a href="list" class="btn btn-secondary">목록</a>
    </div>
  </div>
</body>
</html>
