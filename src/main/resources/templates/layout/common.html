<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>스프링 게시판 - 목록</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/list.css}">
</head>
<body>
    <div class="container">
        <th:block th:fragment="nav-header(title)">
            <div class="header-top">
                <div class="service-logo"><a th:href="@{/post/list}">사자샘터</a></div>
                <h1 class="page-title" th:text="${title}">게시글 목록</h1>
                <div class="user-nav">
                    <th:block th:if="${session.loginMember == null}">
                        <a th:href="@{/member/login}">로그인</a>
                        <a th:href="@{/member/register}">회원가입</a>
                    </th:block>
                    <th:block th:if="${session.loginMember != null}">
                        <span class="user-welcome" th:text="${session.loginMember.username + '님'}">사용자님</span>
                        <form th:action="@{/member/logout}" method="post">
                            <button type="submit" class="btn-link">로그아웃</button>
                        </form>
                    </th:block>
                </div>
            </div>
            <div class="nav">
                <a th:href="@{/post/list}">게시글 목록</a>
                <a th:href="@{/post/write}">새 글 쓰기</a>
                <a th:href="@{/member/list}">회원 목록</a>
            </div>
        </th:block>
    </div>
</body>
</html>
