<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>로그인</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/write.css}">
</head>
<body>
  <div class="container center-container">
    <th:block th:replace="~{layout/common :: nav-header('로그인')}">
      <h1>로그인</h1>
      <div class="nav">
        <a href="list">목록으로</a>
      </div>
    </th:block>

    <form th:action="@{login}" method="post" th:object="${loginForm}">
      <div class="form-group">
        <label for="username">아이디</label>
        <input type="text" id="username" th:field="*{username}" required>
        <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">에러 메세지</div>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" th:field="*{password}"  required>
        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">에러 메세지</div>
        <div class="field-error" th:if="${errorMessage}" th:text="${errorMessage}">에러 메세지</div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn">로그인</button>
        <a th:href="@{list}" class="btn btn-secondary">목록으로</a>
      </div>
    </form>
  </div>
</body>
</html>
