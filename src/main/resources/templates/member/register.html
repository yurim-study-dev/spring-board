<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원 가입</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/write.css}">
</head>
<body>
  <div class="container center-container">
    <th:block th:replace="~{layout/common :: nav-header('회원 가입')}">
      <h1>회원 가입</h1>
      <div class="nav">
        <a href="list">목록으로</a>
      </div>
    </th:block>

    <form th:action="@{register}" method="post" th:object="${memberForm}">
      <div class="form-group">
        <label for="username">아이디</label>
        <input type="text" id="username" th:field="*{username}" required>
        <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">에러 메세지</div>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" th:field="*{password}" required>
        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">에러 메세지</div>
      </div>
      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" th:field="*{email}">
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">에러 메세지</div>
      </div>
      <div class="form-group">
        <label>권한 구분</label>
        <label style="display:inline-block; font-weight:normal; margin-right: 15px;">
          <input type="radio" th:field="*{role}" value="user"> 일반 사용자 (user)
        </label>
        <label style="display:inline-block; font-weight:normal;">
          <input type="radio" th:field="*{role}" value="admin"> 관리자 (admin)
        </label>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn">가입하기</button>
        <a th:href="@{list}" class="btn btn-secondary">목록으로</a>
      </div>
    </form>
  </div>
</body>
</html>
