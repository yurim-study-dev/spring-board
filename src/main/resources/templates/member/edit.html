<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원 정보 수정 및 탈퇴</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/write.css}">
</head>
<body>
  <div class="container center-container">
    <th:block th:replace="~{layout/common :: nav-header('회원 정보 수정')}">
      <h1>회원 정보 수정</h1>
      <div class="nav">
        <a href="list">목록으로</a>
      </div>
    </th:block>

    <form th:action="@{edit}" method="post" th:object="${memberForm}">
      <input type="hidden" th:field="*{id}">
      <div class="form-group">
        <label for="username">아이디</label>
        <input type="text" id="username" th:field="*{username}" readonly>
        <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">에러 메세지</div>
      </div>
      <div class="form-group">
        <label for="password">새 비밀번호</label>
        <input type="password" id="password" th:field="*{password}">
        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">에러 메세지</div>
      </div>
      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" th:field="*{email}">
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">에러 메세지</div>
      </div>
      <div class="form-group">
        <label for="role">권한 구분</label>
        <input type="text" id="role" th:field="*{role}" readonly>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn">수정하기</button>
        <button type="submit" form="withdrawForm" class="btn btn-danger" onclick="return confirm('정말로 탈퇴하시겠습니까?');">탈퇴하기</button>
        <a th:href="@{list}" class="btn btn-secondary">목록으로</a>
      </div>
    </form>

    <form id="withdrawForm" th:action="@{withdraw}" method="post">
      <input type="hidden" name="id" th:value="${memberForm.id}">
    </form>
  </div>
</body>
</html>
